RepoType: git
Repo: https://github.com/ukpratik/starfolk.git

Builds:
  - versionName: 1.0.0
    versionCode: 10000
    commit: v1.0.0
    subdir: app
    gradle:
      - fdroid
    # The fdroid flavour never links Play code (CI gate 6). Strip the play-only dependencies and sources anyway,
    # so the scanner sees no non-free libraries in the build files.
    rm:
      - app/src/play
    prebuild:
      - sed -i -e '/"playImplementation"/d' build.gradle.kts
      - sed -i -e '/^play-/d' ../gradle/libs.versions.toml

