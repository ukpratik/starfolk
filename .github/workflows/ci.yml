# SPDX-License-Identifier: GPL-3.0-or-later
# ADR-009/013: CI runs exactly scripts/ci.sh, so local and CI results match.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/ci.sh
